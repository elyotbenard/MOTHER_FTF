<!-- V3 -->

<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Map Of Tattoo Happening & Event Regions - French Tatoo Festival</title>
  
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pirata+One&family=UnifrakturMaguntia&display=swap" rel="stylesheet">

  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #0a0a0a;
      font-family: Arial, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 12px;
    }

    .site-frame {
      border: 3px solid #b30000;
      box-shadow: 0 0 15px rgba(179, 0, 0, 0.5), inset 0 0 20px rgba(0, 0, 0, 0.9);
      height: 100%;
      display: flex;
      flex-direction: column;
      background-color: #000;
      border-radius: 8px;
      overflow: hidden;
      position: relative;
    }

    .header-container {
      position: absolute;
      top: 15px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      width: 90%;
      max-width: 680px;
      height: 95px;
      filter: drop-shadow(0 8px 15px rgba(0, 0, 0, 0.9));
    }

    .banner-svg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    .header-content {
      position: relative;
      z-index: 2;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 0 60px;
      text-align: center;
    }

    .title-main {
      font-family: 'Pirata One', 'UnifrakturMaguntia', cursive;
      color: #ffffff;
      font-size: 2.8rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      line-height: 1;
    }

    .title-sub {
      color: #cccccc;
      font-size: 0.68rem;
      font-family: 'Georgia', serif;
      font-style: italic;
      letter-spacing: 1px;
      margin-top: 2px;
      text-transform: uppercase;
    }

    #map {
      flex: 1;
      width: 100%;
      height: 100%;
    }

    .leaflet-popup-content-wrapper {
      background: #121212;
      color: #fff;
      border: 2px solid #b30000;
      border-radius: 6px;
      font-family: Arial, sans-serif;
      box-shadow: 0 0 10px rgba(0,0,0,0.8);
      padding: 0;
      overflow: hidden;
    }
    .leaflet-popup-content {
      margin: 12px;
      line-height: 1.4;
    }
    .leaflet-popup-tip {
      background: #121212;
      border: 1px solid #b30000;
    }

    .popup-img {
      width: 100%;
      max-height: 140px;
      object-fit: cover;
      border-radius: 4px;
      border: 1px solid #333;
      margin-bottom: 8px;
      display: block;
      transition: transform 0.2s ease, filter 0.2s ease;
    }

    a .popup-img:hover {
      transform: scale(1.02);
      filter: brightness(1.1);
    }

    .marker-cluster-small,
    .marker-cluster-medium,
    .marker-cluster-large {
      background-color: rgba(179, 0, 0, 0.4) !important;
    }
    .marker-cluster-small div,
    .marker-cluster-medium div,
    .marker-cluster-large div {
      background-color: rgba(10, 10, 10, 0.9) !important;
      color: #ffffff !important;
      border: 2px solid #b30000 !important;
      font-weight: bold;
      font-family: Arial, sans-serif;
      box-shadow: 0 0 8px rgba(179, 0, 0, 0.8);
    }
  </style>

</head>
<body>

  <div class="site-frame">
    <div class="header-container">
      <svg class="banner-svg" viewBox="0 0 680 95" preserveAspectRatio="none">
        <defs>
          <radialGradient id="bannerGrad" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#1a0000" />
            <stop offset="100%" stop-color="#050505" />
          </radialGradient>
        </defs>
        <path d="M 0,47.5 
                 C 20,20 35,0 65,0 
                 L 615,0 
                 C 645,0 660,20 680,47.5 
                 C 660,75 645,95 615,95 
                 L 65,95 
                 C 35,95 20,75 0,47.5 Z" 
              fill="url(#bannerGrad)" 
              stroke="#b30000" 
              stroke-width="3" />
      </svg>

      <header class="header-content">
        <h1 class="title-main">MOTHER FTF</h1>
        <p class="title-sub">Map Of Tattoo Happening & Event Regions - French Tatoo Festival</p>
      </header>
    </div>

    <div id="map"></div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>

  <script>
    const GOOGLE_SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRIHszxRmdZUcEEQygwtr0jr89RE8srkGaZU8c0bKxspEKhJTo0LNuyZZAQQEoShJqhfnUgWym0kM-v/pub?gid=0&single=true&output=csv';

    const map = L.map('map', {
      zoomControl: false
    }).setView([46.603354, 1.888334], 6);

    L.control.zoom({ position: 'bottomright' }).addTo(map);

    L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png?key=cb1_3q57_1_2ae0965728892381462e5f84', {
      maxZoom: 15,
      minZoom: 5,
      subdomains: 'abcd',
      attribution: '© OpenStreetMap contributors © CARTO'
    }).addTo(map);

    const markersGroup = L.markerClusterGroup({
      spiderfyOnMaxZoom: true,
      showCoverageOnHover: false,
      zoomToBoundsOnClick: true,
      spiderfyDistanceMultiplier: 1.5,
      maxClusterRadius: 20
    });

    const redIcon = L.icon({
      iconUrl: 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 36" width="24" height="36"><path fill="%23b30000" stroke="%23ffffff" stroke-width="1.5" d="M12 0C5.37 0 0 5.37 0 12c0 9 12 24 12 24s12-15 12-24c0-6.63-5.37-12-12-12zm0 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5z"/></svg>',
      iconSize: [25, 41],
      iconAnchor: [12, 41],
      popupAnchor: [1, -34]
    });

    const greyIcon = L.icon({
      iconUrl: 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 36" width="24" height="36"><path fill="%23666666" stroke="%23ffffff" stroke-width="1.5" d="M12 0C5.37 0 0 5.37 0 12c0 9 12 24 12 24s12-15 12-24c0-6.63-5.37-12-12-12zm0 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5z"/></svg>',
      iconSize: [25, 41],
      iconAnchor: [12, 41],
      popupAnchor: [1, -34]
    });

    Papa.parse(GOOGLE_SHEET_CSV_URL, {
      download: true,
      header: false,
      complete: function(results) {
        const rows = results.data.slice(1); 

        rows.forEach(festival => {
          const lat = parseFloat(festival[0]); 
          const lng = parseFloat(festival[1]); 

          if (!isNaN(lat) && !isNaN(lng)) {
            let popup = '';
            
            const nom = festival[2] || 'Festival'; 
            const ville = festival[3];           
            const date = festival[4];             
            const image = festival[5];            
            const link = festival[6];             
            const statusH = String(festival[7] || '0').trim();

            if (image && image !== 'X') {
              if (link && link !== 'X') {
                popup += `<a href="${link}" target="_blank" rel="noopener noreferrer"><img src="${image}" alt="${nom}" class="popup-img"></a>`;
              } else {
                popup += `<img src="${image}" alt="${nom}" class="popup-img">`;
              }
            }
            
            popup += `<b style="color: #b30000; font-size: 1.1em;">${nom}</b>`;

            if (ville && ville !== 'X') popup += `<br>${ville}`;
            if (date && date !== 'X') popup += `<br><i style="color: #bbb;">${date}</i>`;

            const selectedIcon = (statusH === '1') ? greyIcon : redIcon;

            const marker = L.marker([lat, lng], { icon: selectedIcon }).bindPopup(popup);
            markersGroup.addLayer(marker);
          }
        });

        map.addLayer(markersGroup);
      }
    });
  </script>

</body>
</html>
